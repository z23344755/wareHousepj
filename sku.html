<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU 数据展示</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .import-controls {
            margin: 15px 0;
            text-align: right;
        }

        #importStatus {
            margin-left: 10px;
            color: #4CAF50;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f4f4f4;
            font-weight: bold;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 50%;
            border-radius: 5px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: black;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        .btn:hover {
            background-color: #45a049;
        }

        .btn-secondary {
            background-color: #f44336;
        }

        .btn-secondary:hover {
            background-color: #d32f2f;
        }

        .action-buttons {
            display: flex;
            justify-content: flex-end;
        }

        #importProgress {
            margin-top: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>SKU 数据展示</h1>

    <!-- 新增的导入按钮区域 -->
    <div class="import-controls">
        <button id="importExcelBtn" class="btn">导入Excel</button>
        <span id="importStatus"></span>
    </div>

    <table id="sku-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>SKU Code</th>
                <th>Name</th>
                <th>Description</th>
                <th>Company</th>
                <th>Quantity</th>
                <th>Created At</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- 数据将通过 JavaScript 动态插入 -->
        </tbody>
    </table>

    <!-- 原有的编辑Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit SKU</h2>
            <form id="editForm">
                <input type="hidden" id="editSkuCode">
                <div class="form-group">
                    <label for="editName">Name:</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label for="editDescription">Description:</label>
                    <textarea id="editDescription"></textarea>
                </div>
                <div class="form-group">
                    <label for="editCompany">Company:</label>
                    <input type="text" id="editCompany">
                </div>
                <div class="form-group">
                    <label for="editQuantity">Quantity:</label>
                    <input type="number" id="editQuantity" min="0">
                </div>
                <div class="action-buttons">
                    <button type="button" class="btn" id="saveChanges">Save Changes</button>
                    <button type="button" class="btn btn-secondary" id="cancelEdit">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 新增的导入Modal -->
    <div id="importModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Excel导入</h2>
            <div class="form-group">
                <label for="excelFile">选择Excel文件:</label>
                <input type="file" id="excelFile" accept=".xlsx, .xls">
            </div>
            <div class="action-buttons">
                <button type="button" class="btn" id="confirmImport">开始导入</button>
                <button type="button" class="btn btn-secondary" id="cancelImport">Cancel</button>
            </div>
            <div id="importProgress"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const tbody = document.querySelector('#sku-table tbody');
            const editModal = document.getElementById('editModal');
            const editCloseBtn = editModal.querySelector('.close');
            const cancelEditBtn = document.getElementById('cancelEdit');
            const saveBtn = document.getElementById('saveChanges');
            let currentSku = null;

            // 新增的导入相关变量
            const importExcelBtn = document.getElementById('importExcelBtn');
            const importModal = document.getElementById('importModal');
            const importCloseBtn = importModal.querySelector('.close');
            const cancelImportBtn = document.getElementById('cancelImport');
            const confirmImportBtn = document.getElementById('confirmImport');
            const excelFileInput = document.getElementById('excelFile');
            const importProgress = document.getElementById('importProgress');
            const importStatus = document.getElementById('importStatus');

            // 从 API 获取数据
            function fetchData() {
                fetch('/api/sku')
                    .then(response => response.json())
                    .then(data => {
                        tbody.innerHTML = '';
                        data.forEach(item => {
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${item.id}</td>
                                <td><a href="http://127.0.0.1:5000/in_out_history.html?sku_code=${item.sku_code}">${item.sku_code}</a></td>
                                <td>${item.name}</td>
                                <td>${item.description}</td>
                                <td>${item.company}</td>
                                <td>${item.quantity}</td>
                                <td>${new Date(item.created_at).toLocaleString()}</td>
                                <td>
                                <button class="btn edit-btn" data-sku='${JSON.stringify(item)}'>Edit</button>
                                <button class="btn delete-btn" data-sku='${item.sku_code}'>Delete</button>
                                </td>
                            `;
                            tbody.appendChild(row);
                        });

                        // Add event listeners to all edit buttons
                        document.querySelectorAll('.edit-btn').forEach(btn => {
                            btn.addEventListener('click', function() {
                                currentSku = JSON.parse(this.getAttribute('data-sku'));
                                openEditModal(currentSku);
                            });
                        });

                        document.querySelectorAll('.delete-btn').forEach(btn => {
                            btn.addEventListener('click', function() {
                                currentSku = this.getAttribute('data-sku');
                                delete_sku(currentSku);
                            });
                        });
                    })
                    .catch(error => {
                        console.error('Error fetching data:', error);
                        tbody.innerHTML = '<tr><td colspan="8" style="color: red;">加载数据失败，请稍后重试。</td></tr>';
                    });
            }

            // Open modal with SKU data
            function openEditModal(sku) {
                document.getElementById('editSkuCode').value = sku.sku_code;
                document.getElementById('editName').value = sku.name || '';
                document.getElementById('editDescription').value = sku.description || '';
                document.getElementById('editCompany').value = sku.company || '';
                document.getElementById('editQuantity').value = sku.quantity || 0;
                editModal.style.display = 'block';
            }

            // Close modal
            function closeEditModal() {
                editModal.style.display = 'none';
                currentSku = null;
            }

            // Save changes
            function saveChanges() {
                const skuData = {
                    sku_code: document.getElementById('editSkuCode').value,
                    name: document.getElementById('editName').value,
                    description: document.getElementById('editDescription').value,
                    company: document.getElementById('editCompany').value,
                    quantity: parseInt(document.getElementById('editQuantity').value)
                };

                fetch('/api/sku/update', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(skuData)
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    alert('SKU updated successfully!');
                    closeEditModal();
                    fetchData(); // Refresh the table
                })
                .catch(error => {
                    console.error('Error updating SKU:', error);
                    alert('Error updating SKU: ' + error.message);
                });
            }

            function delete_sku(sku_code) {
                const skuData = {
                    sku_code: sku_code,
                };

                fetch('/api/sku/delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(skuData)
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    alert('SKU deleted successfully!');
                    fetchData(); // Refresh the table
                })
                .catch(error => {
                    console.error('Error deleted SKU:', error);
                    alert('Error deleted SKU: ' + error.message);
                });
            }

            // 新增的导入相关函数

            // 打开导入模态框
            importExcelBtn.addEventListener('click', () => {
                excelFileInput.value = '';
                importProgress.style.display = 'none';
                importModal.style.display = 'block';
            });

            // 关闭导入模态框
            const closeImportModal = () => {
                importModal.style.display = 'none';
            };

            importCloseBtn.addEventListener('click', closeImportModal);
            cancelImportBtn.addEventListener('click', closeImportModal);

            // 处理导入
            confirmImportBtn.addEventListener('click', () => {
                const file = excelFileInput.files[0];
                if (!file) {
                    alert('请选择Excel文件');
                    return;
                }

                importProgress.style.display = 'block';
                importProgress.innerHTML = '正在导入，请稍候...';
                importStatus.textContent = '';

                const formData = new FormData();
                formData.append('file', file);

                fetch('/api/upload_skus', {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('导入失败: ' + response.statusText);
                    }
                    return response.json();
                })
                .then(data => {
                    importProgress.innerHTML = `
                        <strong>导入成功!</strong><br>
                        新增: ${data.stats.inserted} 条<br>
                        更新: ${data.stats.updated} 条<br>
                        跳过: ${data.stats.skipped} 条
                    `;
                    importStatus.textContent = '导入完成';

                    // 3秒后自动刷新数据
                    setTimeout(fetchData, 3000);
                })
                .catch(error => {
                    console.error('导入错误:', error);
                    importProgress.innerHTML = `<strong style="color:red;">导入失败:</strong> ${error.message}`;
                    importStatus.textContent = '导入失败';
                });
            });

            // 原有事件监听器
            editCloseBtn.addEventListener('click', closeEditModal);
            cancelEditBtn.addEventListener('click', closeEditModal);
            saveBtn.addEventListener('click', saveChanges);

            // Close modal when clicking outside of it
            window.addEventListener('click', function(event) {
                if (event.target === editModal) {
                    closeEditModal();
                }
                if (event.target === importModal) {
                    closeImportModal();
                }
            });

            // Initial data load
            fetchData();
        });
    </script>
</body>
</html>
